[package]
name = "syntechpos-caja"
version = "0.1.0"
description = "SyntechPOS — Cliente de caja (POS de escritorio, offline-first)"
authors = ["Javier Ferreira"]
edition = "2021"

[lib]
# El sufijo `_lib` evita el choque de nombres lib/bin en Windows
name = "syntechpos_caja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

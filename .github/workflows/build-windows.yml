name: Compilar caja (Windows)

# Compila el instalador de la caja para Windows (.msi + .exe) en un runner de
# GitHub, sin necesidad de instalar Rust/MSVC en ninguna PC. La URL del servidor
# se "hornea" al compilar (VITE_API_URL) — la eliges al lanzar el workflow.
#
# Cómo usarlo:
#   GitHub → pestaña Actions → "Compilar caja (Windows)" → Run workflow →
#   escribe la URL del servidor → al terminar, descarga el artifact con el .msi.
#
# También compila al empujar un tag "caja-vX.Y.Z".

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL del servidor que usará la caja (VITE_API_URL)'
        required: true
        default: 'http://localhost:8000/api/v1'
  push:
    tags:
      - 'caja-v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust (acelera compilaciones futuras)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias npm
        run: npm ci

      - name: URL del servidor (se incrusta en el build)
        shell: bash
        run: echo "VITE_API_URL=${{ inputs.api_url || 'http://localhost:8000/api/v1' }}" > .env

      - name: Compilar instalador (.msi + .exe)
        run: npm run tauri build

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: SyntechPOS-Caja-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
